# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name praxedistechnologies.com www.praxedistechnologies.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.praxedistechnologies.com$request_uri;
    }
}

# Primary HTTPS server (www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.praxedistechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/praxedistechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxedistechnologies.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/praxedistechnologies.access.log;
    error_log  /var/log/nginx/praxedistechnologies.error.log;
}

# Redirect bare domain to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name praxedistechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/praxedistechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxedistechnologies.com/privkey.pem;

    return 301 https://www.praxedistechnologies.com$request_uri;
}
