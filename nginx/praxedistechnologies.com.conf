#erver {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.praxedistechnologies.co 1. Redirect all HTTP to HTTPS (Both bare and www)
server {
    listen 80;
    listen [::]:80;
    server_name praxedistechnologies.com www.praxedistechnologies.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }                          m;

    ssl_certificate     /etc/letsencrypt/live/praxedistechnologies.com/fullc                         hain.pem;
    ss                         l_certificate_key /etc/letsencrypt/live/praxedistechnologies.com/privkey.pem;
                             ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/praxedistechnologies.access.log;
    error_log  /var/log/nginx/praxedistechnologies.error.log;
}

    location / {
        return 301 https://www.praxedistechnologies.com$request_uri;
    }
}

# 2. Redirect Bare HTTPS to WWW HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name praxedistechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/praxedistechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/praxedistechnologies.com/privkey.pem;

    return 301 https://www.praxedistechnologies.com$request_uri;
}

